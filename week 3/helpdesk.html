<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="CWA Help Desk Appointment" />
    <meta name="author" content="Trung Hieu" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CWA Help Desk Appointment</title>
  </head>
  <body>
    <header>
      <a href="https://www.swinburne.edu.au/">
        <img
          src="logo.png"
          alt="Swinburne University of Technology logo"
        />
      </a>
      <h1>CWA Help Desk Appointment</h1>
      <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
      <p>Check Blackboard for when CWA tutors will be there</p>
    </header>

    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php" target="_blank">
          <fieldset>
            <legend>Student detail</legend>
            <p>
              <label for="student-id">Student ID</label>
              <input
                type="text"
                id="student-id"
                name="student_id"
                pattern="[0-9]{7,10}"
                title="Enter between 7 and 10 digits."
                required
              />
            </p>

            <p>
              <label for="given-name">Given Name</label>
              <input
                type="text"
                id="given-name"
                name="given_name"
                maxlength="15"
                pattern="[A-Za-z]+"
                title="Use alphabetic characters only."
                required
              />

              <label for="family-name">Family Name</label>
              <input
                type="text"
                id="family-name"
                name="family_name"
                maxlength="15"
                pattern="[A-Za-z]+"
                title="Use alphabetic characters only."
                required
              />
            </p>
          </fieldset>

          <fieldset>
            <legend>Your unit</legend>
            <p>
              <input
                type="radio"
                id="cos10011"
                name="unit"
                value="cos10011"
                required />
              <label for="cos10011">COS10011</label>
              <input 
                type="radio" 
                id="cos60004" 
                name="unit" 
                value="COS60004" />
              <label for="cos60004">COS60004</label>

              <input 
                type="radio" 
                id="cos60007" 
                name="unit" 
                value="COS60007" />
              <label for="cos60007">COS60007</label>
            </p>

            <p>
              <label for="tutor">Tutor</label>
              <select id="tutor" name="tutor" required>
                <option value="">Please selected</option>
                <option value="thomas-harrison">Thomas Harrison</option>
                <option value="dr.le.minh.duc">Dr. Le Minh Duc</option>
              </select>
            </p>
          </fieldset>

          <fieldset>
            <legend>Issues</legend>
            <p>
              <input
              type="checkbox"
              id="html"
              name="issue[]"
              value="html"
              checked 
              />
              <label for="html">HTML</label>

              <input
              type="checkbox"
              id="css"
              name="issue[]"
              value="CSS"
              
              />
              <label for="css">CSS</label>
              <input
              type="checkbox"
              id="javascript"
              name="issue[]"
              value="javascript"
              
              />
              <label for="javascript">JavaScript</label>

              <input
              type="checkbox"
              id="php"
              name="issue[]"
              value="PHP"
              
              />
              <label for="php">PHP</label>

              <input 
              type="checkbox"
              id="MySQL"
              name="issue[]"
              value="MySQL"
              
              />
              <label for="MySQL">MySQL</label>
            </p>

            <p>
              <label for="description">Description of Issue</label><br>
              <textarea 
              id="description" 
              name="description" 
              rows="4" 
              cols="50">
            </textarea>
            </p>
          </fieldset>


          
          <fieldset>
          <legend>Preferred Date / Time</legend>
          <p>
            <label for="date">Date</label>
            <input
              type="text"
              id="date"
              name="date"
              placeholder="dd/mm/yyyy"
              pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}"
              title="Enter a date in dd/mm/yyyy format."
              required
            />
          </p>

          <p>
            <label for="time">Time</label>
            <input
              type="text"
              id="time"
              name="time"
              placeholder="00:00"
              pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
              title="Enter a time in 24-hour HH:MM format."
              required
            />
          </p>
        </fieldset>
          <input type="submit" value="Book" />
          <input type="reset" value="Reset form" />
        </p>
      </form>
    </main>
  </body>
</html>
